# Deployment manifest for cv-forge.
version: 1
application: votoclaro

shared:
  files:
    - .env
  directories:
    - storage

hooks:
  before_activate:
    # Fails early on a PHP mismatch, before any migration runs.
    - name: smoke
      run: [php, artisan, --version]
      timeout_seconds: 30
    - name: storage-link
      run: [php, artisan, storage:link]
      timeout_seconds: 30
    # Must stay backward compatible: rollback restores code, not data.
    - name: migrate
      run: [php, artisan, migrate, --force]
      timeout_seconds: 600
    - name: optimize
      run: [php, artisan, optimize]
      timeout_seconds: 120
  after_activate:
    # The application cache lives in the database and survives deploys and rollbacks:
    # clear it once the new release serves requests, so no old-format entry is read.
    - name: cache-clear
      run: [php, artisan, cache:clear]
      timeout_seconds: 60
    # Restarts queue workers and the scheduler (queue:restart, schedule:interrupt).
    # After cache-clear, because the queue:restart signal is stored in the cache.
    - name: reload
      run: [php, artisan, reload]
      timeout_seconds: 60

reload:
  # Required: production runs with opcache.validate_timestamps=0. votoclaro has its own
  # PHP-FPM on production, run by its own user (cv-infra ADR 017).
  - cv-php-fpm-votoclaro

environments:
  production:
    health_check:
      type: http
      url: https://votoclaro.pt/up
      timeout_seconds: 60
