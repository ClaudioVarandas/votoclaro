# Used by the build workflow to scan the release tree. Keep every exception narrow:
# one rule, one file, and the reason.
[extend]
useDefault = true

[[allowlists]]
description = "MIME type table in symfony/mime, matched by generic-api-key; not a secret"
targetRules = ["generic-api-key"]
paths = ['''(^|/)vendor/symfony/mime/MimeTypes\.php$''']

[[allowlists]]
description = "Release script of halaxa/json-machine, matched by curl-auth-user; its credentials are shell variables read from the author's own .env, not a secret"
targetRules = ["curl-auth-user"]
paths = ['''(^|/)vendor/halaxa/json-machine/Makefile$''']
